<!doctype html>
<html lang="de" dir="ltr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- Kein maximum-scale / user-scalable=no: Zoomen muss möglich bleiben. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>VoxDoc</title>
    <meta
      name="description"
      content="Barrierefreie Dokumentenerkennung für blinde und sehbehinderte Menschen."
    />

    <meta name="theme-color" content="#0b0d12" />
    <meta name="color-scheme" content="dark light" />

    <!-- iOS Home-Bildschirm -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="VoxDoc" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />

    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Zum Inhalt springen</a>

    <p id="offline-banner" class="offline-banner" hidden>
      Offline – alle Funktionen bleiben verfügbar.
    </p>

    <div id="storage-banner" class="storage-banner" hidden>
      <p id="storage-banner-text"></p>
      <button type="button" id="storage-banner-reload" class="button button-secondary" hidden>Seite neu laden</button>
    </div>

    <!-- Ansichten werden per Hash-Router hier eingesetzt. -->
    <main id="main" class="app-main" tabindex="-1"></main>

    <nav class="tab-bar" aria-label="Hauptnavigation">
      <ul>
        <li>
          <a href="#/" data-tab="start">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z" /></svg>
            <span>Start</span>
          </a>
        </li>
        <li>
          <a href="#/bibliothek" data-tab="library">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zM8.5 11h7M8.5 15h7" /></svg>
            <span>Bibliothek</span>
          </a>
        </li>
        <li>
          <a href="#/suche" data-tab="search">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" /><path d="M15.5 15.5L21 21" /></svg>
            <span>Suche</span>
          </a>
        </li>
        <li>
          <a href="#/einstellungen" data-tab="settings">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10" /><circle cx="16" cy="7" r="2" /><circle cx="8" cy="17" r="2" /></svg>
            <span>Einstellungen</span>
          </a>
        </li>
        <li>
          <a href="#/hilfe" data-tab="help">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17.5v.01" /></svg>
            <span>Hilfe</span>
          </a>
        </li>
      </ul>
    </nav>

    <!-- Live-Region für VoiceOver-Ansagen; muss von Anfang an im DOM sein. -->
    <div id="announcer" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></div>

    <!-- Kamera bzw. Fotoauswahl; werden über die Scan-Schaltflächen geöffnet. -->
    <input id="camera-input" type="file" accept="image/*" capture="environment" hidden tabindex="-1" aria-hidden="true" />
    <input id="photo-input" type="file" accept="image/*" multiple hidden tabindex="-1" aria-hidden="true" />

    <noscript>
      <p class="card">VoxDoc benötigt JavaScript. Bitte aktiviere JavaScript in den Safari-Einstellungen.</p>
    </noscript>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
